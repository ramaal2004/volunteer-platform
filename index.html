<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التطوع الجامعي</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; text-align: right; max-width: 800px; margin: 30px auto; padding: 0 15px; background: #f9f9f9; }
        h1, h2 { color: #2c3e50; }
        .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .form-box { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-top: 25px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; font-size: 16px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #219150; }
        #status { margin-top: 12px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>
    <h1>منصة الفرص التطوعية الجامعية</h1>
    <h2>الفرص المتاحة حالياً</h2>
    <div id="opportunities-list">جاري تحميل الفرص...</div>

    <div class="form-box">
        <h2>التقديم على فرصة تطوعية</h2>
        <form id="apply-form">
            <label for="student_name">اسم الطالب الكامل:</label>
            <input type="text" id="student_name" required placeholder="أدخل اسمك الكامل">

            <label for="student_id">الرقم الجامعي:</label>
            <input type="text" id="student_id" required placeholder="مثال: 20221045">

            <label for="opportunity_id">اختر الفرصة التطوعية:</label>
            <select id="opportunity_id" required></select>

            <button type="submit">إرسال طلب التطوع</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        async function loadOpportunities() {
            const res = await fetch('/api/opportunities');
            const data = await res.json();
            const list = document.getElementById('opportunities-list');
            const select = document.getElementById('opportunity_id');
            list.innerHTML = '';
            select.innerHTML = '';

            data.forEach(op => {
                list.innerHTML += `
                    <div class="card">
                        <h3>${op.title}</h3>
                        <p><strong>الجهة:</strong> ${op.organization} | <strong>المكان:</strong> ${op.location} | <strong>التاريخ:</strong> ${op.date}</p>
                    </div>`;
                select.innerHTML += `<option value="${op.id}">${op.title}</option>`;
            });
        }

        document.getElementById('apply-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                student_name: document.getElementById('student_name').value,
                student_id: document.getElementById('student_id').value,
                opportunity_id: Number(document.getElementById('opportunity_id').value)
            };
            const res = await fetch('/api/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            document.getElementById('status').innerText = result.message || result.error;
            if (res.ok) e.target.reset();
        });

        loadOpportunities();
    </script>
</body>
</html>
